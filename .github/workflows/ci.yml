name: CI

on:
  push:
  pull_request:

jobs:
  ts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: StikSound/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: StikSound
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: StikSound
        run: pnpm typecheck
      - name: Run unit tests
        working-directory: StikSound
        run: pnpm test

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        working-directory: StikSound
        run: cargo test --workspace --exclude stiksound-desktop
